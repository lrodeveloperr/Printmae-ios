name: PrintMae iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Engine/**'
      - 'project.yml'
      - '.github/workflows/printmae-ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project PrintMaeApp.xcodeproj \
            -scheme PrintMaeApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
