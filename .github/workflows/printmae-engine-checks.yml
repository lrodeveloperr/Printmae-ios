name: PrintMae Engine Checks

on:
  push:
    branches: [main]
    paths:
      - 'Engine/**'
      - '.github/workflows/printmae-engine-checks.yml'
  workflow_dispatch:
    inputs:
      skip_fuzz:
        description: 'Skip the 30-minute parser fuzz jobs (for fast iteration on the other jobs)'
        type: boolean
        default: false
      skip_mutation:
        description: 'Skip the mutation-score job (for fast iteration on the other jobs)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-package:
    name: Native Swift package and harness
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report Apple toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run structural gate
        working-directory: Engine
        run: bash Scripts/verify_structure.sh

      - name: Build and run XCTest
        working-directory: Engine
        run: swift test -Xswiftc -warnings-as-errors

      - name: Run end-to-end plain harness
        working-directory: Engine
        run: swift run printmae-harness scenario

      - name: Run deterministic engine sentinels
        working-directory: Engine
        run: |
          swift run printmae-harness geometry-property 100000
          swift run printmae-harness entitlement-sim
          swift run printmae-harness state-matrix

  parser-fuzz:
    name: 30-minute ${{ matrix.parser }} fuzz session
    needs: native-package
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_fuzz != true }}
    runs-on: macos-26
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        parser: [pdfkit, cgpdf]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fuzz parser for 30 minutes
        working-directory: Engine
        run: swift run -c release printmae-harness fuzz-${{ matrix.parser }} 1800 250925

  mutation-score:
    name: Critical-module mutation score
    needs: native-package
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_mutation != true }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Muter
        run: brew install muter-mutation-testing/formulae/muter

      - name: Run mutation testing on critical modules
        working-directory: Engine
        run: |
          muter --skip-update-check --skip-coverage \
            --operators RelationalOperatorReplacement RemoveSideEffects ChangeLogicalConnector \
            --files-to-mutate 'Sources/PrintMaeEngine/Analysis.swift,Sources/PrintMaeEngine/Engine.swift,Sources/PrintMaeEngine/Entitlements.swift,Sources/PrintMaeEngine/Geometry.swift,Sources/PrintMaeEngine/Profiles.swift,Sources/PrintMaeEngine/Repair.swift,Sources/PrintMaeEngine/StateMachine.swift,Sources/PrintMaeEngine/Verification.swift' \
            --output mutation-report.txt
          cat mutation-report.txt
          python3 Scripts/check_mutation_score.py mutation-report.txt 80

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printmae-mutation-report
          path: Engine/mutation-report.txt
          if-no-files-found: ignore

  device-budgets:
    name: iPhone 16e memory and performance budgets
    needs: native-package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The default Xcode on this runner image ships an iOS runtime whose
      # smallest simulator device is "iPhone 17e" — "iPhone 16e" (what the
      # tests gate on and what the product's performance budget references)
      # only exists in the iOS 26.2 runtime, bundled with Xcode 26.2/26.3.
      - name: Select Xcode 26.2 (ships the iPhone 16e simulator runtime)
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Report simulator toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -A2 "iOS 26.2" || true

      - name: Run memory and performance budget tests on iPhone 16e
        working-directory: Engine
        run: |
          xcodebuild test \
            -scheme PrintMaeEngine-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16e,OS=26.2' \
            -only-testing:PrintMaeEngineTests/MemoryBudgetTests \
            -only-testing:PrintMaeEngineTests/PerformanceBudgetTests \
            CODE_SIGNING_ALLOWED=NO
