name: PrintMaeApp
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  GoodUseShell:
    url: https://github.com/lrodeveloperr/Swift-UI-shell-ios.git
    revision: 6de35c55a2a3fe57f4f7551d8eabce739ba4cc45
  PrintMaeEngine:
    path: Engine
targets:
  PrintMaeApp:
    type: application
    platform: iOS
    sources:
      - path: App/PrintMaeApp.swift
      - path: App/PrintMaeModel.swift
      - path: App/PrintMaeLocalization.swift
      - path: App/Resources
    dependencies:
      - package: GoodUseShell
        product: GoodUseShell
      - package: PrintMaeEngine
        product: PrintMaeEngine
      - package: PrintMaeEngine
        product: PrintMaeStoreKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worksbien.printmae
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: ja
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: targeted
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: ja
        CFBundleDisplayName: プリント前
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        'UISupportedInterfaceOrientations~ipad':
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            LSItemContentTypes: [com.adobe.pdf]
            LSHandlerRank: Alternate
          - CFBundleTypeName: Images
            LSItemContentTypes: [public.jpeg, public.png, public.heic]
            LSHandlerRank: Alternate
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        UISupportsDocumentBrowser: false
        UIApplicationSupportsDocumentBrowser: false
